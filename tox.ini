[tox]
envlist = py,qa
skip_missing_interpreters = True
isolated_build = true
minversion = 4.0.0

[testenv]
# rpi_ws281x is a Raspberry Pi hardware library with a C extension that cannot
# be compiled on x86. All hardware deps are mocked in the test suite, so we
# skip the package install and install it manually with --no-deps.
skip_install = true
deps =
	mock
	pytest>=3.1
	pytest-cov
	build
	pimoroni-ioexpander>=1.0.1
	gpiodevice
	smbus2
commands_pre =
	pip install --no-deps {toxinidir}
commands =
	coverage run -m pytest -v -r wsx
	coverage report

[testenv:qa]
skip_install = true
commands =
	check-manifest
	python -m build --no-isolation
	python -m twine check dist/*
	isort --check .
	ruff check .
	codespell .
deps =
	check-manifest
	ruff
	codespell
	isort
	twine
	build
	hatch
	hatch-fancy-pypi-readme

